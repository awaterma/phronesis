<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Phronesis governance lifecycle</title>
  <desc id="desc">An agent tool call passes through hooks, fact extraction, the RETE engine, and an allow, warn, or block decision.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #f4f8f7; }
    .box { fill: #ffffff; stroke: #b5ceca; stroke-width: 2; }
    .active { fill: #e4efed; stroke: #0f766e; stroke-width: 3; }
    .ink { fill: #102a2e; }
    .muted { fill: #536f70; }
    .accent { fill: #0f766e; }
    .wire { fill: none; stroke: #29484b; stroke-width: 4; }
    .arrow { fill: #29484b; }
    text { font-family: Manrope, Inter, system-ui, sans-serif; }
    .eyebrow { font-size: 17px; font-weight: 800; letter-spacing: 2.5px; }
    .heading { font-size: 25px; font-weight: 800; }
    .small { font-size: 16px; font-weight: 600; }
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 15px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d2023; }
      .box { fill: #142c30; stroke: #426462; }
      .active { fill: #173f3d; stroke: #55b9ae; }
      .ink { fill: #eef8f6; }
      .muted { fill: #b4ceca; }
      .wire { stroke: #9fc2bd; }
      .arrow { fill: #9fc2bd; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path class="arrow" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="390" rx="24"/>
  <text class="eyebrow muted" x="54" y="50">THE GOVERNANCE BOUNDARY</text>

  <g class="box">
    <rect x="54" y="104" width="186" height="154" rx="16"/>
    <rect x="306" y="104" width="186" height="154" rx="16"/>
    <rect x="558" y="104" width="186" height="154" rx="16"/>
  </g>
  <rect class="active" x="810" y="104" width="336" height="154" rx="16"/>

  <text class="eyebrow muted" x="80" y="139">01 · AGENT</text>
  <text class="heading ink" x="80" y="179">Tool call</text>
  <text class="mono muted" x="80" y="211">Edit · Bash · Write</text>

  <text class="eyebrow muted" x="332" y="139">02 · HOOK</text>
  <text class="heading ink" x="332" y="179">Normalize</text>
  <text class="mono muted" x="332" y="211">pre · post · audit</text>

  <text class="eyebrow muted" x="584" y="139">03 · RETE</text>
  <text class="heading ink" x="584" y="179">Match facts</text>
  <text class="mono muted" x="584" y="211">α → β → P-state</text>

  <text class="eyebrow accent" x="836" y="139">04 · HOST DECISION</text>
  <text class="heading ink" x="836" y="179">Allow · warn · block</text>
  <text class="mono muted" x="836" y="211">exit 0 · exit 1 · exit 2</text>

  <g class="wire" marker-end="url(#arrow)">
    <path d="M240 181 H306"/>
    <path d="M492 181 H558"/>
    <path d="M744 181 H810"/>
  </g>

  <path d="M399 280 V320 H651 V280" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="7 7"/>
  <text class="small muted" x="525" y="348" text-anchor="middle">rules and derived graph state are read fresh from disk</text>
  <text class="small muted" x="600" y="302" text-anchor="middle">outside the conversation</text>
</svg>
