[workspace]
# Publish whenever `main` holds a version crates.io does not.
#
# This was `false`, meaning "only release from a Release PR" — but release-plz
# reads that as "only from a Release PR *it authored*". A hand-authored
# Release PR (needed when release-plz itself cannot compute a version, as
# happened when v0.22.1 was tagged but never published) merged the version
# bump and was then skipped with "current commit is not from a release PR",
# exiting green having published nothing.
#
# Existing packages normally already match the registry on an ordinary push.
# A new workspace package is an exception: it can require publication even
# without a version bump. Bootstrap its first version and trusted publisher
# as described in docs/RELEASING.md. This setting removes dependence on who
# authored a Release PR. `scripts/verify-crates-io.py` checks registry state.
release_always = true

# CHANGELOG.md is hand-curated (Keep a Changelog with Migration sections);
# release-plz manages versions/tags/publishing only.
changelog_update = false

# One tag PER PACKAGE, not one for the version group.
#
# This was `v{{ version }}`, a single shared tag. That is what made a partial
# publish self-concealing: release-plz treats "the tag for this release
# exists" as "this package is released", so once any one crate's publish
# created `vX.Y.Z`, every later crate in the group reported
# `Already published - Tag vX.Y.Z already exists` and was skipped without the
# registry ever being consulted. `phronesis-mcp` publishes last and so was the
# casualty every time: v0.20.1, v0.21.0, v0.22.1, v0.24.0.
#
# Per-package tags make that check mean what it says. This does NOT split the
# version: all five crates still share one version through `version_group`
# below, because `phronesis-mcp` depends on the other four and skew would be
# pure bookkeeping. It splits only the *tag*, which was never a version
# statement — it was a per-package "did this ship" marker wearing a
# version-shaped name.
#
# The GitHub releases were already per-package (`phronesis-mcp-v0.24.0`,
# `phronesis-v0.24.0`), so this aligns the tag with naming release-plz was
# already using one layer up.
git_tag_name = "{{ package }}-v{{ version }}"

# Pre-1.0 house rule: any user-visible feature bumps MINOR.
features_always_increment_minor = true

publish_timeout = "30m"
semver_check = true
dependencies_update = false
pr_labels = ["release"]

# Unified version across all five crates (version.workspace = true).
[[package]]
name = "phronesis"
version_group = "workspace"

[[package]]
name = "phronesis-rhai"
version_group = "workspace"

[[package]]
name = "phronesis-metrics"
version_group = "workspace"

[[package]]
name = "phronesis-mcp"
version_group = "workspace"

[[package]]
name = "phronesis-governance"
version_group = "workspace"
