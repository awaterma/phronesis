[package]
name = "phronesis-governance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Embeddable governance core for the phronesis RETE engine: strict rules parsing, validation, compilation, and capsule payload validation, free of filesystem, MCP, and host dependencies."

[dependencies]
anyhow = "1"
phr = { package = "phronesis", version = "0.41.1", path = "../phronesis" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
