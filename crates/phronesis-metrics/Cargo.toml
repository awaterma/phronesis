[package]
name = "phronesis-metrics"
version.workspace = true
edition = "2024"
rust-version = "1.90"
description = "Prometheus metrics for phronesis — derives rule, hook, and context-cost metric families from the `.phronesis/log.jsonl` action log and exposes them over an OpenMetrics endpoint."
license = "MIT"
authors = ["Andrew Waterman"]
repository = "https://github.com/awaterma/phronesis"
homepage = "https://github.com/awaterma/phronesis"
readme = "README.md"
keywords = ["prometheus", "metrics", "observability", "openmetrics", "rules-engine"]
categories = ["development-tools"]

[dependencies]
# Deliberately does NOT depend on phronesis-mcp: the action log is a stable
# JSON Lines format, so this crate parses it directly and the dependency
# arrow points one way (phronesis-mcp -> phronesis-metrics).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prometheus-client = "0.25"
tokio = { version = "1", features = ["net", "rt", "macros", "io-util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
