[package]
name = "phronesis-mcp"
version.workspace = true
edition = "2024"
rust-version = "1.90"
description = "MCP server and CLI (phr-mcp) wrapping the phronesis RETE rules engine for durable enforcement of project conventions in LLM-assisted work."
license = "MIT"
authors = ["Andrew Waterman"]
repository = "https://github.com/awaterma/phronesis"
homepage = "https://github.com/awaterma/phronesis"
readme = "README.md"
keywords = ["mcp", "rules-engine", "llm", "code-quality", "rete"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["tests/", "tests/features/"]

[lib]
name = "phronesis_mcp"
path = "src/lib.rs"

[[bin]]
name = "phr-mcp"
path = "src/main.rs"

[features]
default = ["rhai"]
# Route expressive `__script__` conditions through the sandboxed Rhai
# evaluator and enable project predicate providers. Enabled by default;
# `--no-default-features` retains the dependency-minimal builtin DSL.
rhai = ["dep:phronesis-rhai"]
# Expose a Prometheus `/metrics` endpoint and the `phr-mcp metrics` exporter.
# Off by default: the endpoint needs an HTTP stack, and the default build has
# no use for hyper and its transitive tree.
metrics = ["dep:phronesis-metrics"]

[dependencies]
phr = { version = "0.36.0", path = "../phronesis", package = "phronesis", features = ["schemars"] }
phronesis-rhai = { version = "0.36.0", path = "../phronesis-rhai", optional = true }
phronesis-metrics = { version = "0.36.0", path = "../phronesis-metrics", optional = true }
rmcp = { version = "0.17", features = ["server", "macros", "transport-io", "schemars"] }
rustc-demangle = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_norway = "0.9"
schemars = "1.0"
anyhow = "1"
thiserror = "2"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
streaming-iterator = "0.1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-swift = "0.7"
fs2 = "0.4"
ignore = "0.4"
chrono = "0.4"
dirs = "5"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"
# 0.5.9–0.5.15 reject U+212A in string literals; covered by parser regression.
tree-sitter-java-orchard = "=0.5.8"
roxmltree = "0.20"
# S5 rendered-body validation lexes with a real Rust lexer (byte spans for the
# interpolation check) and fail-closed parses; both already in the lock file.
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
syn = { version = "2", default-features = false, features = ["full", "parsing"] }
globset = "0.4"
tempfile = "3"

[dev-dependencies]
cucumber = "0.23"
criterion = { version = "0.5", features = ["async_tokio"] }
rand = "0.8"

[[test]]
name = "bdd"
harness = false

[[bench]]
name = "journey_derive"
harness = false

[[bench]]
name = "graph_sync"
harness = false
