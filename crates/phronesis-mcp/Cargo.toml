[package]
name = "phronesis-mcp"
version = "0.12.0"
edition = "2024"
rust-version = "1.90"
description = "MCP server and CLI (phr-mcp) wrapping the phronesis RETE rules engine for durable enforcement of project conventions in LLM-assisted work."
license = "MIT"
authors = ["Andrew Waterman"]
repository = "https://github.com/awaterma/phronesis"
homepage = "https://github.com/awaterma/phronesis"
readme = "README.md"
keywords = ["mcp", "rules-engine", "llm", "code-quality", "rete"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["tests/", "tests/features/"]

[lib]
name = "phronesis_mcp"
path = "src/lib.rs"

[[bin]]
name = "phr-mcp"
path = "src/main.rs"

[dependencies]
phr = { version = "0.12.0", path = "../phronesis", package = "phronesis", features = ["schemars"] }
rmcp = { version = "0.17", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
schemars = "1.0"
anyhow = "1"
thiserror = "2"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
streaming-iterator = "0.1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-swift = "0.7"
fs2 = "0.4"
ignore = "0.4"
chrono = "0.4"
dirs = "5"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
cucumber = "0.23"
tempfile = "3"

[[test]]
name = "bdd"
harness = false
