[package]
name = "phronesis-rhai"
version.workspace = true
edition = "2024"
rust-version = "1.90"
description = "Rhai script evaluator for the phronesis RETE engine — expressive `__script__` guard conditions with numeric comparisons and boolean combinators over fact arguments."
license = "MIT"
authors = ["Andrew Waterman"]
repository = "https://github.com/awaterma/phronesis"
homepage = "https://github.com/awaterma/phronesis"
readme = "README.md"
keywords = ["rules-engine", "rete", "rhai", "scripting"]
categories = ["development-tools"]

[dependencies]
phronesis = { path = "../phronesis", version = "0.18" }
# `sync` makes the Rhai `Engine`/`Dynamic` Send + Sync, which the
# `ScriptEval` trait requires (the network is shared behind Arc<Mutex<_>>).
# `no_module`/`no_closure` shrink the sandbox surface.
rhai = { version = "1", features = ["sync", "no_module", "no_closure"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt"] }
