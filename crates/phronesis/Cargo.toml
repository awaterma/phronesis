[package]
name = "phronesis"
version = "0.13.3"
edition = "2024"
rust-version = "1.90"
description = "A RETE rules engine for durable, context-window-independent enforcement of project conventions in LLM-assisted work."
license = "MIT"
authors = ["Andrew Waterman"]
repository = "https://github.com/awaterma/phronesis"
homepage = "https://github.com/awaterma/phronesis"
readme = "README.md"
keywords = ["rules-engine", "rete", "mcp", "llm", "code-quality"]
categories = ["development-tools", "config"]

# This crate is intentionally minimal. It must not depend on any
# domain-specific code — its job is to host the abstraction (Consequence,
# Actor, Provenance) that hosts of the engine implement against.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
anyhow = "1.0"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
# Optional JSON-schema derive for the ID newtypes, so downstream MCP
# servers can use them directly in tool-parameter structs without losing
# the schemars-generated schema. Off by default to keep core minimal.
schemars = { version = "1.0", optional = true }

[features]
default = []
schemars = ["dep:schemars"]

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt"] }
async-trait = "0.1"
anyhow = "1.0"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[[example]]
name = "push_and_pull"
path = "examples/push_and_pull.rs"

[[example]]
name = "rule_driven_lookup"
path = "examples/rule_driven_lookup.rs"

[[bench]]
name = "rete_hot_path"
harness = false
