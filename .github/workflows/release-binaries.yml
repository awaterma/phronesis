name: Release binaries

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      released: ${{ steps.tag.outputs.released }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - id: tag
        name: Read phronesis-mcp version
        shell: bash
        run: |
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "phronesis-mcp") | .version')
          test -n "$version"
          test "$version" != "null"
          tag="phronesis-mcp-v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git tag --points-at HEAD --list "$tag" | grep -Fxq "$tag"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build phr-mcp
        run: cargo build --release --locked -p phronesis-mcp --target ${{ matrix.target }}
      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          archive="phr-mcp-${{ needs.prepare.outputs.tag }}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$archive" phr-mcp
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = "phr-mcp-${{ needs.prepare.outputs.tag }}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/phr-mcp.exe" -DestinationPath $archive
      - name: Wait for release-plz GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..18}; do
            if gh release view "${{ needs.prepare.outputs.tag }}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "GitHub release ${{ needs.prepare.outputs.tag }} did not appear" >&2
          exit 1
      - name: Upload binary archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" phr-mcp-*-${{ matrix.target }}.* --clobber
