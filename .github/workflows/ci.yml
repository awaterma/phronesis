name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Pinned to the workspace MSRV (rust-version in Cargo.toml). This is the
  # gating job: a fixed toolchain keeps the rustfmt/clippy lint set stable so
  # CI never breaks from a toolchain release, and it proves the MSRV claim.
  msrv:
    name: fmt + clippy + test (MSRV 1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Audit repository rules (blocking findings fail CI)
        run: cargo run -p phronesis-mcp -- audit --fail-on block
      # Feature configs must not bit-rot: the embedding-host gate on the
      # engine plus the Rhai evaluator and metrics exporter paths in the MCP
      # each get their own clippy + test pass.
      - run: cargo clippy -p phronesis --all-targets --features embedding-host -- -D warnings
      - run: cargo test -p phronesis --features embedding-host
      # Default features now include metrics, so the workspace pass covers
      # it; this pass keeps the dependency-minimal build from bit-rotting.
      - run: cargo clippy -p phronesis-mcp --all-targets --no-default-features --features rhai -- -D warnings
      - run: cargo test -p phronesis-mcp --no-default-features --features rhai

  # Forward-compat canary: tests on current stable. No clippy here, so new
  # stable lints can't fail the build.
  stable:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Platform guard: cfg-gating breaks (Unix-only helpers called from ungated
  # code) are invisible to the ubuntu matrix — 0.37.0 shipped a Windows
  # compile break this job would have caught. Check-level, lib + bins only,
  # matching what release-binaries builds.
  windows:
    name: windows-check (cargo check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p phronesis-mcp

  coverage-runners:
    name: Real coverage collector (${{ matrix.runner }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: python, os: ubuntu-latest }
          - { runner: lua, os: ubuntu-latest }
          - { runner: vitest, os: ubuntu-latest }
          - { runner: vitest-ts, os: ubuntu-latest }
          - { runner: jest, os: ubuntu-latest }
          - { runner: node, os: ubuntu-latest }
          - { runner: mvn, os: ubuntu-latest }
          - { runner: gradle, os: ubuntu-latest }
          - { runner: swift, os: ubuntu-latest }
          - { runner: swift, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: contains(fromJSON('["vitest", "vitest-ts", "jest", "node"]'), matrix.runner)
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        if: contains(fromJSON('["mvn", "gradle"]'), matrix.runner)
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.runner == 'gradle'
        with:
          gradle-version: "8.14.3"
      - uses: swift-actions/setup-swift@v2
        if: matrix.runner == 'swift' && matrix.os == 'ubuntu-latest'
        with:
          swift-version: "6.1"
      - run: python3 -m pip install pytest==8.3.5 coverage==7.8.0
        if: matrix.runner == 'python'
      - name: Install pinned Lua coverage runner
        if: matrix.runner == 'lua'
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 liblua5.4-dev luarocks build-essential
          sudo luarocks --lua-version=5.4 install busted 2.3.0-1
          sudo luarocks --lua-version=5.4 install luacov 0.17.0-1
          sudo luarocks --lua-version=5.4 install md5 1.3-1
          git clone https://github.com/aimbot/luacov-reporter-lcov.git /tmp/luacov-reporter
          git -C /tmp/luacov-reporter checkout c7018c5cda641ee926329c71ab0291b5b6644032
          cd /tmp/luacov-reporter
          sudo luarocks --lua-version=5.4 make luacov-reporter-lcov-scm-0.rockspec
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
      - name: Verify real pytest isolation edge cases
        if: matrix.runner == 'python'
        run: cargo test -p phronesis-mcp --lib real_pytest_ -- --ignored
      - name: Verify real Swift isolation edge cases
        if: matrix.runner == 'swift'
        run: cargo test -p phronesis-mcp --lib real_swift -- --ignored
      - run: cargo build -p phronesis-mcp
      - run: python3 scripts/coverage-runner-smoke.py --binary target/debug/phr-mcp --runner ${{ matrix.runner }}
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Upload failed collector evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-failure-${{ matrix.runner }}-${{ matrix.os }}
          path: ${{ runner.temp }}/phr coverage smoke *
          include-hidden-files: true
          if-no-files-found: ignore
