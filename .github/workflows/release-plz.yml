name: Release-plz

permissions: {}

on:
  push:
    branches:
      - main

jobs:
  # Publishes unpublished versions + tags + GitHub release.
  # Only acts when the release PR merge lands (release_always = false).
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'awaterma' }}
    permissions:
      contents: write      # push tags, create GitHub releases
      id-token: write      # crates.io Trusted Publishing (OIDC) — no CARGO_REGISTRY_TOKEN
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Opens/updates the Release PR (the human approval gate).
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'awaterma' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          # Fine-grained PAT (Contents + Pull requests rw) stored as RELEASE_PLZ_TOKEN
          # so CI runs on the release PR. GITHUB_TOKEN fallback would open the PR
          # but suppress its CI checks.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
